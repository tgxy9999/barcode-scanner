<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Scanner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Segoe UI, sans-serif; background: #f3f4f6; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  h1 { font-size: 20px; font-weight: 600; color: #1e293b; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #64748b; margin-bottom: 16px; }
  #lib-status { font-size: 13px; padding: 8px 14px; border-radius: 8px; margin-bottom: 14px; width: 100%; max-width: 500px; border: 1px solid; }
  .s-wait { background: #fffbeb; border-color: #fcd34d; color: #92400e; }
  .s-ok   { background: #f0fdf4; border-color: #86efac; color: #166534; }
  .s-err  { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }
  .card { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 20px; width: 100%; max-width: 500px; margin-bottom: 14px; }
  .card h2 { font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 12px; }
  video { width: 100%; border-radius: 8px; display: block; background: #000; max-height: 280px; object-fit: cover; }
  .result { margin-top: 12px; padding: 12px; border-radius: 8px; font-size: 14px; line-height: 1.7;
            background: #f8fafc; border: 1px solid #e2e8f0; color: #64748b; word-break: break-all; }
  .result.ok      { background: #f0fdf4; border-color: #86efac; color: #166534; }
  .result.err     { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }
  .result.sending { background: #eff6ff; border-color: #93c5fd; color: #1e40af; }
  .result.sent    { background: #f0fdf4; border-color: #86efac; color: #166534; }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 14px; font-weight: 500; cursor: pointer; }
  .b-blue { background: #2563eb; color: #fff; } .b-blue:hover { background: #1d4ed8; }
  .b-red  { background: #ef4444; color: #fff; } .b-red:hover  { background: #dc2626; }
  #send-status { margin-top: 8px; font-size: 13px; color: #64748b; min-height: 20px; text-align: center; }
  #frames { font-size: 12px; color: #94a3b8; margin-top: 6px; text-align: center; }
  .tip { font-size: 12px; color: #94a3b8; margin-top: 8px; text-align: center; }
</style>
</head>
<body>

<h1>Barcode Scanner</h1>
<p class="sub">Powered by ZXing · Sends to Power Apps via Power Automate</p>
<div id="lib-status" class="s-wait">⏳ Loading ZXing library…</div>

<div class="card">
  <h2>📷 Live Camera</h2>
  <video id="video" playsinline muted></video>
  <div class="result" id="scan-result">Press Start, then aim at your barcode.</div>
  <div id="send-status"></div>
  <div id="frames"></div>
  <div class="btn-row">
    <button class="b-blue" onclick="startCamera()">▶ Start</button>
    <button class="b-red"  onclick="stopCamera()">■ Stop</button>
  </div>
  <p class="tip">Scans continuously · Result auto-sends to Power Apps.</p>
</div>

<script>
  /* ─────────────────────────────────────────────
     PASTE YOUR POWER AUTOMATE HTTP TRIGGER URL HERE
  ───────────────────────────────────────────── */
  var FLOW_URL = 'https://default83e7a35a0a994b62815fd0f746eb13.7b.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/064c853e6c3b45fda769c509d652c56d/triggers/manual/paths/invoke?api-version=1';

  /* ── ZXing Loader ── */
  var zxingReady = false;
  var lastScanned = '';        // prevent duplicate sends
  var cameraReader = null;
  var frameCount = 0;

  function loadScript(src, ok, fail) {
    var s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  }

  function onZXingLoaded() {
    if (typeof ZXing === 'undefined' || !ZXing.BrowserMultiFormatReader) {
      setLibStatus('err', '❌ ZXing loaded but not initialised. Refresh the page.');
      return;
    }
    zxingReady = true;
    setLibStatus('ok', '✅ ZXing ready — press Start to scan.');
  }

  loadScript(
    'https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js',
    onZXingLoaded,
    function () {
      loadScript(
        'https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js',
        onZXingLoaded,
        function () { setLibStatus('err', '❌ Both CDNs failed — check internet and refresh.'); }
      );
    }
  );

  function setLibStatus(type, msg) {
    var el = document.getElementById('lib-status');
    el.className = 's-' + type;
    el.textContent = msg;
  }

  function guard() {
    if (!zxingReady) { alert('ZXing not ready — wait for the green banner.'); return false; }
    return true;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ── Camera Scan ── */
  function startCamera() {
    if (!guard() || cameraReader) return;
    var resultEl   = document.getElementById('scan-result');
    var sendEl     = document.getElementById('send-status');
    resultEl.className = 'result';
    resultEl.textContent = '🔍 Scanning… aim at your barcode.';
    sendEl.textContent   = '';
    frameCount = 0;
    lastScanned = '';

    cameraReader = new ZXing.BrowserMultiFormatReader();
    cameraReader.decodeFromVideoDevice(null, document.getElementById('video'), function (result, err) {
      frameCount++;
      document.getElementById('frames').textContent = 'Frames: ' + frameCount;

      if (result) {
        var value  = result.getText();
        var format = String(result.getBarcodeFormat());

        // Show scan result immediately
        resultEl.className = 'result ok';
        resultEl.innerHTML =
          '✅ <strong>READABLE</strong><br>' +
          '<strong>Value:</strong> '  + escHtml(value) + '<br>' +
          '<strong>Format:</strong> ' + escHtml(format);

        // Only send if different from last scan (avoid spam)
        if (value !== lastScanned) {
          lastScanned = value;
          sendToFlow(value, format);
        }

      } else if (err && !(err instanceof ZXing.NotFoundException)) {
        resultEl.className = 'result err';
        resultEl.textContent = '❌ ' + err.message;
      }
    });
  }

  function stopCamera() {
    if (cameraReader) { cameraReader.reset(); cameraReader = null; }
    document.getElementById('frames').textContent = '';
    lastScanned = '';
    var r = document.getElementById('scan-result');
    r.className = 'result';
    r.textContent = 'Camera stopped. Press Start to scan again.';
    document.getElementById('send-status').textContent = '';
  }

  /* ── Send to Power Automate ── */
  function sendToFlow(value, format) {
    var sendEl = document.getElementById('send-status');

    if (!FLOW_URL || FLOW_URL === 'PASTE_YOUR_POWER_AUTOMATE_URL_HERE') {
      sendEl.textContent = '⚠️ Power Automate URL not configured.';
      return;
    }

    sendEl.textContent = '📡 Sending to Power Apps…';

    var payload = {
      barcodeValue:  value,
      barcodeFormat: format,
      scannedAt:     new Date().toISOString()
    };

    fetch(FLOW_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(payload)
    })
    .then(function (res) {
      if (res.ok) {
        sendEl.textContent = '✅ Sent to Power Apps successfully!';
      } else {
        sendEl.textContent = '⚠️ Flow responded with status ' + res.status;
      }
    })
    .catch(function (err) {
      sendEl.textContent = '❌ Failed to send: ' + err.message;
    });
  }
</script>

</body>
</html>
